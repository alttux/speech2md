# =============================================================================
# speech2md — конфигурационный файл
# =============================================================================
# Расположение по умолчанию: ~/.config/speech2md/config.toml
# Можно создать из этого примера:
#   cp config.example.toml ~/.config/speech2md/config.toml
# Или через CLI:
#   speech2md config set <key> <value>
# =============================================================================

# ---------------------------------------------------------------------------
# Whisper / STT
# ---------------------------------------------------------------------------

# Модель faster-whisper: tiny, base, small, medium, large-v3, large-v2, etc.
whisper_model = "large-v2"

# Устройство: "cpu" или "cuda"
device = "cpu"

# Тип вычислений: "int8", "float16", "int8_float16", "float32"
#   Для CPU используйте "int8" (быстрее всего) или "float32" (точнее).
#   Для CUDA используйте "float16" (быстрее) или "int8_float16".
compute_type = "int8"

# Язык распознавания: "ru", "en", "" (пусто = автоопределение)
language = ""

# Размер beam-search (выше = точнее, но медленнее).
#   Рекомендации: 3–5 для скорости, 5–10 для качества.
beam_size = 5

# ---------------------------------------------------------------------------
# LLM (пост-обработка текста)
# ---------------------------------------------------------------------------

# Бэкенд: "ollama" или "openai"
llm_backend = "ollama"

# URL API. Для Ollama: http://localhost:11434
# Для OpenAI: https://api.openai.com/v1
# Можно переопределить через переменную окружения:
#   OLLAMA_URL          — для ollama
#   OPENAI_BASE_URL     — для openai
llm_url = "http://10.147.19.141:11434"

# Название модели.
#   Ollama: gemma4, llama3, mistral, qwen2.5, etc.
#   OpenAI: gpt-4o-mini, gpt-4o, gpt-3.5-turbo, etc.
llm_model = "gemma4"

# API-ключ (только для OpenAI).
# Можно задать через переменную окружения OPENAI_API_KEY.
# Внимание: хранение ключа в этом файле — небезопасно.
llm_api_key = ""

# Таймаут запроса к LLM в секундах.
llm_timeout = 120

# Максимальное количество токенов в ответе. 0 = без ограничения.
llm_max_tokens = 0

# Сколько раз повторить запрос при таймауте, обрыве связи или ошибке 5xx.
#   0 = без повторов. Важно для длинных файлов: один сбой на 20-м чанке
#   иначе обесценивает всю предыдущую работу.
llm_retries = 2

# Базовая задержка между повторами в секундах (растёт экспоненциально:
#   backoff, backoff*2, backoff*4, ...).
llm_retry_backoff = 2.0

# ---------------------------------------------------------------------------
# Режим обработки
# ---------------------------------------------------------------------------

# Что делать с распознанным текстом:
#   "transcript" — исправить ошибки распознавания, сохранив текст дословно;
#   "conspect"   — составить конспект лекции (заголовки, списки, ключевые идеи).
# В режиме conspect длинный текст обрабатывается по схеме map-reduce:
#   каждый чанк конспектируется отдельно, затем конспекты сшиваются
#   финальным запросом к LLM. Результат сохраняется как <имя>.conspect.md
format_mode = "transcript"

# ---------------------------------------------------------------------------
# Обработка длинного текста (chunking)
# ---------------------------------------------------------------------------

# Максимальное количество слов в одном чанке для LLM.
#   Если текст короче chunk_size, отправляется целиком.
#   Границы чанков выравниваются по концам предложений.
chunk_size = 2000

# Перекрытие между соседними чанками (в словах).
#   Помогает избежать потери контекста на стыках.
#   Обрезается до chunk_size / 2, если задано больше.
overlap = 200

# ---------------------------------------------------------------------------
# Промпты (шаблоны для LLM)
# ---------------------------------------------------------------------------

# Русскоязычный промпт. {text} заменяется на распознанный текст.
prompt_template_ru = """
Исправь ошибки распознавания речи, не меняя смысл и стиль. Оформи текст как Markdown. Сохрани структуру речи.

{text}
"""

# Англоязычный промпт.
prompt_template_en = """
Fix speech recognition errors without changing meaning or style. Format the text as Markdown. Preserve speech structure.

{text}
"""

# Промпты для режима format_mode = "conspect" (шаг map: конспект одного чанка).
prompt_template_conspect_ru = """
Составь конспект лекции по расшифровке ниже. Выдели темы заголовками Markdown, ключевые идеи — списками, сохрани термины, определения и примеры. Опусти оговорки и повторы.

{text}
"""

prompt_template_conspect_en = """
Write lecture notes from the transcript below. Use Markdown headings for topics, bullet lists for key ideas, and keep terms, definitions and examples. Drop filler and repetitions.

{text}
"""

# Промпты шага reduce: сшивание конспектов соседних частей в один документ.
#   Используются только когда текст не поместился в один чанк.
prompt_template_merge_ru = """
Ниже — конспекты последовательных частей одной лекции. Объедини их в один связный конспект Markdown: убери повторы, слей дублирующиеся разделы, выстрой сквозную структуру заголовков. Не добавляй информацию, которой нет в тексте.

{text}
"""

prompt_template_merge_en = """
Below are notes from consecutive parts of one lecture. Merge them into a single coherent Markdown document: remove repetitions, fold duplicate sections together, and build one consistent heading structure. Do not add information that is not in the text.

{text}
"""

# ---------------------------------------------------------------------------
# Вывод результатов
# ---------------------------------------------------------------------------

# Директория для сохранения .md файлов.
#   По умолчанию: ~/.config/speech2md/output/
output_dir = "/home/nani/Documents/speech2md/outputs"

# ---------------------------------------------------------------------------
# VAD (Voice Activity Detection) — для будущего режима реального времени
# ---------------------------------------------------------------------------

vad_threshold = 0.5
vad_min_speech_duration = 0.5
vad_min_silence_duration = 1.0
